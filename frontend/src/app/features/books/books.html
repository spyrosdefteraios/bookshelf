<div class="min-h-screen bg-gray-50">

  <!-- Header -->
  <div class="bg-white border-b border-gray-200 px-8 py-6">
    <div class="flex justify-between items-center max-w-7xl mx-auto">
      <div>
        <h1 class="text-2xl font-bold text-gray-800">My Books</h1>
        <p class="text-gray-500 mt-1">Manage your personal library</p>
      </div>
      <button (click)="showAddForm = !showAddForm"
              class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg font-medium transition flex items-center gap-2">
        <i class="fas" [class.fa-plus]="!showAddForm" [class.fa-times]="showAddForm"></i>
        {{ showAddForm ? 'Cancel' : 'Add Book' }}
      </button>
    </div>
  </div>

  <div class="max-w-7xl mx-auto px-8 py-8">

    <!-- Add Book Form -->
    <div *ngIf="showAddForm" class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-8">
      <h2 class="text-lg font-bold text-gray-800 mb-4">Add New Book</h2>
      <form (ngSubmit)="addBook()">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Title *</label>
            <input type="text" [(ngModel)]="newBook.title" name="title" required
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Author *</label>
            <input type="text" [(ngModel)]="newBook.author" name="author" required
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Genre</label>
            <input type="text" [(ngModel)]="newBook.genre" name="genre"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
            <select [(ngModel)]="newBook.status" name="status"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
              <option value="wishlist">Wishlist</option>
              <option value="reading">Reading</option>
              <option value="read">Read</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Pages</label>
            <input type="number" [(ngModel)]="newBook.pages" name="pages"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Year</label>
            <input type="number" [(ngModel)]="newBook.year" name="year"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Rating (1-5)</label>
            <input type="number" [(ngModel)]="newBook.rating" name="rating" min="1" max="5"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
            <input type="text" [(ngModel)]="newBook.description" name="description"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
          </div>
        </div>
        <button type="submit"
                class="mt-4 bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-lg font-medium transition">
          Add Book
        </button>
      </form>
    </div>

    <!-- Filters -->
    <div class="flex gap-3 mb-6">
      <button (click)="statusFilter=''; loadBooks()"
              [class.bg-indigo-600]="statusFilter === ''"
              [class.text-white]="statusFilter === ''"
              [class.bg-white]="statusFilter !== ''"
              [class.text-gray-600]="statusFilter !== ''"
              class="px-4 py-2 rounded-lg font-medium border border-gray-200 transition">
        All
      </button>
      <button (click)="statusFilter='reading'; loadBooks()"
              [class.bg-blue-600]="statusFilter === 'reading'"
              [class.text-white]="statusFilter === 'reading'"
              [class.bg-white]="statusFilter !== 'reading'"
              [class.text-gray-600]="statusFilter !== 'reading'"
              class="px-4 py-2 rounded-lg font-medium border border-gray-200 transition">
        Reading
      </button>
      <button (click)="statusFilter='read'; loadBooks()"
              [class.bg-green-600]="statusFilter === 'read'"
              [class.text-white]="statusFilter === 'read'"
              [class.bg-white]="statusFilter !== 'read'"
              [class.text-gray-600]="statusFilter !== 'read'"
              class="px-4 py-2 rounded-lg font-medium border border-gray-200 transition">
        Read
      </button>
      <button (click)="statusFilter='wishlist'; loadBooks()"
              [class.bg-yellow-500]="statusFilter === 'wishlist'"
              [class.text-white]="statusFilter === 'wishlist'"
              [class.bg-white]="statusFilter !== 'wishlist'"
              [class.text-gray-600]="statusFilter !== 'wishlist'"
              class="px-4 py-2 rounded-lg font-medium border border-gray-200 transition">
        Wishlist
      </button>
    </div>

    <!-- Empty State -->
    <div *ngIf="books.length === 0" class="text-center py-16 text-gray-400">
      <i class="fas fa-book text-6xl mb-4"></i>
      <p class="text-xl font-medium">No books found!</p>
      <p class="mt-2">Add your first book to get started</p>
    </div>

    <!-- Books Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
      <div *ngFor="let book of books"
           class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition">

        <div class="bg-indigo-50 p-6 text-center">
          <i class="fas fa-book text-indigo-400 text-4xl"></i>
        </div>

        <div class="p-4">
          <h3 class="font-bold text-gray-800 truncate">{{ book.title }}</h3>
          <p class="text-gray-500 text-sm truncate">{{ book.author }}</p>

          <div class="flex items-center justify-between mt-3">
            <span class="px-2 py-1 rounded-full text-xs font-medium"
                  [class.bg-blue-100]="book.status === 'reading'"
                  [class.text-blue-700]="book.status === 'reading'"
                  [class.bg-green-100]="book.status === 'read'"
                  [class.text-green-700]="book.status === 'read'"
                  [class.bg-yellow-100]="book.status === 'wishlist'"
                  [class.text-yellow-700]="book.status === 'wishlist'">
              {{ book.status }}
            </span>
            <span *ngIf="book.rating" class="text-yellow-500 text-sm">
              ⭐ {{ book.rating }}/5
            </span>
          </div>

          <div class="flex gap-2 mt-4">
            <a [routerLink]="['/books', book.id]"
               class="flex-1 text-center bg-indigo-50 hover:bg-indigo-100 text-indigo-600 py-2 rounded-lg text-sm font-medium transition">
              View
            </a>
            <button (click)="deleteBook(book.id)"
                    class="flex-1 bg-red-50 hover:bg-red-100 text-red-600 py-2 rounded-lg text-sm font-medium transition">
              Delete
            </button>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
